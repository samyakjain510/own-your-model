[project]
name = "own-your-model"
version = "0.0.1"
description = "Turn workflow logs into an eval set, training data, and an own-vs-rent decision for small open models."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []  # Phase 1 is stdlib-only so the quickstart runs anywhere.

[project.optional-dependencies]
train-mlx = ["mlx-lm"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]
